name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK'yı derle
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Kiblenuma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Kiblenuma-apk
          path: Kiblenuma.apk

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kıblenüma 1.0.${{ github.run_number }}
          body: Telefonda bu sayfadan Kiblenuma.apk dosyasını indirip kur.
          files: Kiblenuma.apk
