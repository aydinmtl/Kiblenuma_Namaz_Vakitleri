name: APK derle

# Ne zaman çalışır?
# - Pull Request açılınca / güncellenince: testler + APK derlenir, APK "artifact" olarak indirilebilir.
# - main'e her push'ta: aynısı + GitHub Release (v1.0.<numara>) yayınlanır.
# - Elle (Actions sekmesinden "Run workflow"): testler + APK.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Varsayılan olarak yalnızca okuma izni. Release adımı kendi iznini aşağıda ister.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Test raporunu sakla (test başarısız olursa bakmak için)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/

      - name: APK'yı derle
        run: ./gradlew assembleRelease --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Kiblenuma.apk

      # PR'larda da APK indirilebilir: PR sayfası -> Checks -> "APK derle" -> Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: Kiblenuma-apk
          path: Kiblenuma.apk

      # Play Store için imzalı AAB. Yalnızca main'de ve elle çalıştırmada; yükleme anahtarı
      # GitHub Secrets'a eklenmemişse bu adımlar atlanır (ayrıntı: PLAY_STORE.md).
      - name: Play Store AAB'sini derle (yükleme anahtarıyla)
        id: aab
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Yükleme anahtarı tanımlı değil; AAB atlandı."
            exit 0
          fi
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$UPLOAD_KEYSTORE_PATH"
          ./gradlew bundleRelease -PplayUpload --stacktrace
          rm -f "$UPLOAD_KEYSTORE_PATH"
          cp app/build/outputs/bundle/release/app-release.aab Kiblenuma.aab
          echo "built=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.built == 'true'
        with:
          name: Kiblenuma-aab
          path: Kiblenuma.aab

  release:
    # Yalnızca main'e yapılan push'ta yayınla; PR'larda ve elle çalıştırmada yayın yok.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Kiblenuma-apk

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kıblenüma 1.0.${{ github.run_number }}
          body: Telefonda bu sayfadan Kiblenuma.apk dosyasını indirip kur.
          files: Kiblenuma.apk
