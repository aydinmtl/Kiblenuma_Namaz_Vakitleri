<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Namaz Öğreniyorum 3B</title>
<!--
  Namaz Öğreniyorum oyununun 3B sahnesi. Tamamı kodla üretilir: hazır model, doku, kütüphane yok.
  Dosyalar: motor.js (çizim), karakter.js (çocuk figürü), duruslar.js (duruşlar ve geçişler),
            sahne.js (abdesthane ve namaz odası), oyun.js (oyunla bağlantı).
-->
<style>
  html, body { margin: 0; height: 100%; background: #0F1F1A; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #tuval { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
  /* Konuşma balonu: figürün başının üstünde */
  #balon {
    position: absolute; transform: translate(-50%, -100%) scale(0.8); opacity: 0; pointer-events: none;
    background: #FFFBEF; color: #1E2A26; font: 600 17px/1.2 system-ui, sans-serif; padding: 7px 13px; border-radius: 15px;
    box-shadow: 0 3px 10px rgba(0,0,0,.35); white-space: nowrap; transition: opacity .18s, transform .18s; max-width: 80vw;
  }
  #balon.acik { opacity: 1; transform: translate(-50%, -100%) scale(1); }
  #balon::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #FFFBEF; }
  body.hata #tuval, body.hata #balon { display: none; }
</style>
</head>
<body>
<canvas id="tuval"></canvas>
<div id="balon"></div>
<script src="motor.js"></script>
<script src="karakter.js"></script>
<script src="duruslar.js"></script>
<script src="sahne.js"></script>
<script src="oyun.js"></script>
</body>
</html>
